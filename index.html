<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9a1f">
<meta name="description" content="Mushir Ahmad - website and mobile app developer. Explore my 3D city portfolio.">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Mushir Ahmad Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: fixed full-screen 3D city; the page scroll only drives the camera and the walking character. No text overlays on the city. */
:root{
  --sky:#bfe0f5;
  --glass:rgba(255,255,255,.94);
  --ink:#1c2b2a;
  --muted:#5b6b69;
  --line:rgba(28,43,42,.12);
  --sun:#ff9a1f;
  --sun-ink:#2b1700;
  --leaf:#2f9d57;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html{scroll-behavior:auto}
body{
  background:linear-gradient(#9fd0f0,#f4e4d0 60%,#9fcf74);
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y}
#track{height:760svh;pointer-events:none}
h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* HUD: icons only */
.hud{position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.avatar{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:3px solid #fff;padding:0;cursor:pointer;
  background:#3a2a1c center/cover no-repeat;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.dots{pointer-events:auto;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:999px;padding:8px 4px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.dot{width:28px;height:26px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;position:relative}
.dot i{width:9px;height:9px;border-radius:50%;background:rgba(28,43,42,.3);transition:transform .25s,background .25s}
.dot[aria-current="true"] i{background:var(--sun);transform:scale(1.5)}
.dot b{position:absolute;right:34px;top:50%;transform:translateY(-50%);white-space:nowrap;font:700 12px var(--body);
  background:var(--ink);color:#fff;padding:3px 9px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.dot:hover b,.dot:focus-visible b,.dots.open .dot b{opacity:1}
.dots.open .dot b{pointer-events:auto;padding:6px 11px;font-size:13px}
.dots.open .dot[aria-current="true"] b{background:var(--sun);color:var(--sun-ink)}


/* Contact form scene (character pulls the form out of a case) */
.scene{flex:none;display:flex;align-items:flex-end;gap:4px;background:#fff;border-radius:20px;border:1.5px solid var(--line);padding:12px 10px 14px 4px;overflow:hidden;position:relative;min-height:300px}
.chrcol{flex:none;width:96px;position:relative;align-self:flex-start;margin-top:20px;height:240px}
.chrcol canvas{position:absolute;left:-6px;bottom:0;width:130px;height:240px;z-index:0}
/* the green form */
.fcard{flex:1;min-width:0;background:#6b9b52;border-radius:12px;padding:14px 12px 12px;box-shadow:0 8px 22px rgba(40,70,25,.35),inset 0 0 0 2px rgba(255,255,255,.12);transform-origin:0% 100%;opacity:0;pointer-events:none}
.scene.f .fcard{opacity:1;animation:fe 1.1s cubic-bezier(.2,.85,.25,1) forwards}
@keyframes fe{0%{transform:translate(var(--fx,-40px),var(--fy,200px)) scale(.05) rotate(-8deg);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
  50%{transform:translate(calc(var(--fx,-40px)*.35),calc(var(--fy,200px)*.35)) scale(.55) rotate(-3deg);clip-path:polygon(16% 0,84% 0,100% 100%,0 100%)}
  100%{transform:none;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
.scene.r .fcard,.scene.ok .fcard{opacity:1;pointer-events:auto}
.fcard h3{font:700 1.15rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-align:center;margin-bottom:2px}
.fcard .sub{font-size:.78rem;color:#e9f5dc;text-align:center;margin-bottom:10px}
.fcard form{gap:9px}
.fcard label{color:#fff;font-size:.8rem;gap:4px}
.fcard input,.fcard select,.fcard textarea{background:#b9dc9f;border:0;border-radius:9px;min-height:42px;padding:9px 10px;color:#1c3312;font-size:16px}
.fcard textarea{min-height:70px}
.fcard input::placeholder,.fcard textarea::placeholder{color:#5c7f47}
.fcard input[type=file]{padding:8px;font-size:.8rem;min-height:40px}
.fcard .fine{color:#e9f5dc}
.sendb{border:0;border-radius:999px;min-height:46px;background:#f4d44a;color:#3a3000;font:700 1rem var(--display);cursor:pointer;margin-top:2px;box-shadow:0 3px 0 #c8a91d}
.sendb:active{transform:translateY(2px);box-shadow:0 1px 0 #c8a91d}
.fcard .done{display:none;text-align:center;color:#fff;padding:10px 4px 6px}
.fcard .done h3{font-size:1.5rem;margin-bottom:8px}
.fcard .done p{font-size:.95rem;line-height:1.45;margin-bottom:12px}
.fcard .done .btn{background:#f4d44a;color:#3a3000;width:100%;margin-bottom:8px}
.fcard .done .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.scene.ok .fcard form,.scene.ok .fcard .hd{display:none}
.scene.ok .fcard .done{display:block}
.scene.ok .fcard{animation:pop .5s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{transform:scale(.85)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important;transition:none!important}}

/* Projects sheet + preview */
.proj{border:1.5px solid var(--line);border-radius:18px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:10px}
.projart{width:100%;height:190px;border-radius:14px;background:linear-gradient(#f2f2f2,#e4e4e4);position:relative;overflow:hidden;border:0;padding:0;cursor:pointer;display:block}
.projart i{position:absolute;left:50%;top:50%;width:230px;height:120px;margin:-60px 0 0 -115px;border:1.5px dashed #999;border-radius:50%}
.projart b{position:absolute;left:0;right:0;top:46%;text-align:center;font:400 1.6rem/1 "Instrument Serif",Georgia,serif;color:#000;opacity:.5}
.projart .th{position:absolute;height:120px;width:auto;bottom:22px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));transition:transform .4s}
.projart .th0{left:50%;margin-left:-30px;z-index:3;height:150px;bottom:14px}
.projart .th1{left:14%;z-index:2;height:112px}
.projart .th2{right:14%;z-index:2;height:112px}
.projart .th3{left:-2%;z-index:1;height:92px;bottom:30px}
.projart .th4{right:-2%;z-index:1;height:92px;bottom:30px}
.projart:active .th{transform:scale(.97)}
.projart .tap{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:5;background:#111;color:#fff;border-radius:99px;padding:5px 14px;font:600 .78rem var(--display)}
.proj header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.proj h3{font-size:1.1rem}
.price{font:700 1.5rem var(--display);color:#1f7a42}
.soonh{margin-top:6px}
.soonlist{display:flex;flex-direction:column;gap:10px}
.soon{border:2px dashed #e0a020;background:#fff8e6;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.soon .sb{align-self:flex-start;background:#e0a020;color:#fff;font:700 .7rem var(--display);letter-spacing:.08em;padding:3px 9px;border-radius:99px}
#pv{position:fixed;inset:0;z-index:60;background:#ececec;display:flex;flex-direction:column}
.pvbar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:#111;color:#fff}
.pvx{background:#fff;color:#111;border:0;border-radius:99px;min-height:40px;padding:0 16px;font:600 .95rem var(--display);cursor:pointer}
.pvt{flex:1;text-align:center;font-size:.85rem;opacity:.8}
.pvbuy{background:#2fcf6a;color:#06240f;border-radius:99px;min-height:40px;padding:0 16px;display:inline-flex;align-items:center;font:700 .95rem var(--display)}
#pv iframe{flex:1;width:100%;border:0;background:#ececec}
.pvload{position:absolute;top:60px;left:0;right:0;text-align:center;color:#555;font-size:.9rem;padding-top:40px;pointer-events:none}

/* Map button, map, going banner */
.mapbtn{position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;gap:8px;min-height:50px;padding:0 20px 0 14px;border:0;border-radius:99px;background:#111;color:#fff;font:700 1rem var(--display);box-shadow:0 8px 20px rgba(0,0,0,.3);cursor:pointer;-webkit-tap-highlight-color:transparent}
.mapbtn svg{width:24px;height:24px}
.mapbtn.pulse{animation:mp 1.6s ease-in-out 4}
@keyframes mp{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.mapcoach{position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 82px);max-width:230px;background:#fff;color:#111;border-radius:14px;padding:10px 13px;font:600 .88rem/1.35 var(--display);box-shadow:0 8px 20px rgba(0,0,0,.22);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;pointer-events:none}
.mapcoach.on{opacity:1;transform:none}
.mapbox{position:relative;width:100%;border-radius:16px;overflow:hidden;border:1.5px solid var(--line)}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pin b{width:40px;height:40px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font:700 1.05rem var(--display);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.pin span{font:600 .74rem var(--display);background:rgba(255,255,255,.94);color:#111;padding:2px 7px;border-radius:7px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pin.here b{outline:3px solid #111;outline-offset:2px}
.goto{position:fixed;z-index:7;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translate(-50%,-8px);background:#111;color:#fff;border-radius:99px;padding:9px 18px;font:600 .9rem var(--display);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
.goto.on{opacity:1;transform:translate(-50%,0)}
/* Day/Night toggle (neumorphic) */
.dn{position:fixed;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);width:132px;height:56px;padding:0;border:0;border-radius:20px;cursor:pointer;
  background:#e8ebf8;box-shadow:6px 6px 14px rgba(120,130,170,.45),-5px -5px 12px rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.5);transition:background .6s,box-shadow .6s;-webkit-tap-highlight-color:transparent}
.dn canvas{display:block;width:132px;height:56px;border-radius:20px}
body.night .dn{background:#1b2133;box-shadow:6px 6px 14px rgba(0,0,0,.55),-4px -4px 10px rgba(70,80,120,.25),inset 0 0 0 1px rgba(120,140,200,.15)}
.dn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
@media (max-width:380px){.dn{width:112px}.dn canvas{width:112px}}

/* Scroll cue, icon only */
.cue{position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);pointer-events:none;transition:opacity .4s}
.cue i{display:block;width:26px;height:42px;border:3px solid #fff;border-radius:14px;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.cue i::after{content:"";position:absolute;left:50%;top:8px;width:5px;height:9px;border-radius:3px;background:#fff;transform:translateX(-50%);animation:wheel 1.5s infinite}
@keyframes wheel{0%{opacity:1;transform:translate(-50%,0)}80%,100%{opacity:0;transform:translate(-50%,12px)}}
.cue.off{opacity:0}

/* Option chip held out by the character's hand */
.chip3d{position:fixed;z-index:6;left:0;top:0;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 18px 0 14px;border:0;border-radius:999px;
  background:var(--sun);color:var(--sun-ink);font:600 16px var(--display);cursor:pointer;white-space:nowrap;
  box-shadow:0 8px 22px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s;will-change:transform}
.chip3d.on{opacity:1;pointer-events:auto}
.chip3d::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.8);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

/* Arrival speech bubble + star counter */
.say{position:fixed;z-index:6;left:0;top:0;width:max-content;max-width:min(240px,calc(100vw - 32px));padding:9px 13px;border-radius:16px;background:#fff;color:var(--ink);
  font:600 14px/1.3 var(--display);box-shadow:0 8px 22px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;will-change:transform}
.say.on{opacity:1}
.say::after{content:"";position:absolute;left:50%;bottom:-6px;width:13px;height:13px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.starhud{position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;align-items:center;gap:6px;min-height:34px;padding:0 13px 0 11px;
  border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);font:700 14px var(--display);
  box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transition:opacity .35s;pointer-events:none;font-variant-numeric:tabular-nums}
.starhud.on{opacity:1}
.starhud b{color:#e8a010;font-size:17px;line-height:1}
.starhud.pop{animation:starpop .5s}
@keyframes starpop{40%{transform:scale(1.28)}}

.love{position:relative;overflow:hidden;text-align:center;padding:18px 16px 16px;border-radius:18px;background:linear-gradient(#fff1f3,#ffe3e8);border:1.5px solid rgba(232,70,110,.25);margin-bottom:14px}
.love h3{color:#c2305a;font-size:1.25rem;margin:6px 0 4px}
.love p{color:#6b3a47;font-size:.95rem}
.love .big{width:46px;height:46px;fill:#ee4a73;animation:beat 1.3s infinite;display:block;margin:0 auto}
.love .fl{position:absolute;bottom:-20px;width:16px;height:16px;fill:#ff8fa8;opacity:0;animation:rise 4.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-190px) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.love .big,.love .fl{animation:none}}

/* Loader */
.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(#9fd0f0,#f4e4d0);transition:opacity .5s}
.loader.done{opacity:0;pointer-events:none}
.loader div{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:#3a2a1c center/cover no-repeat;box-shadow:0 0 0 0 rgba(255,154,31,.6);animation:pulse 1.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(255,154,31,0)}100%{box-shadow:0 0 0 0 rgba(255,154,31,0)}}

/* Bottom sheet */
.backdrop{position:fixed;inset:0;z-index:8;background:rgba(10,20,20,.28);opacity:0;pointer-events:none;transition:opacity .3s;touch-action:none}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:9;left:0;right:0;bottom:0;max-height:76svh;display:flex;flex-direction:column;background:var(--glass);color:var(--ink);
  border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px))}
.sheet-head h2{font-size:1.5rem;font-weight:600}
.x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(28,43,42,.08);cursor:pointer;position:relative;flex:none}
.x::before,.x::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:2.5px;background:var(--ink);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.sheet-body>*{flex:none}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:4px max(18px,env(safe-area-inset-right,0px)) 22px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
.lead{color:var(--muted);font-size:1.02rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--sun);color:var(--sun-ink);
  font:600 16px var(--display);text-decoration:none;cursor:pointer;text-align:center}
.btn.ghost{background:rgba(28,43,42,.08);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.list li{position:relative;padding-left:26px}
.list li::before{content:"";position:absolute;left:3px;top:.45em;width:12px;height:6px;border-left:2.5px solid var(--leaf);border-bottom:2.5px solid var(--leaf);transform:rotate(-45deg)}
.fine{font-size:.86rem;color:var(--muted)}

.seg{display:inline-flex;max-width:100%;background:rgba(28,43,42,.08);border-radius:999px;padding:4px;align-self:flex-start;overflow-x:auto}
.seg button{border:0;background:none;color:var(--ink);font:600 15px var(--display);min-height:40px;padding:0 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--sun);color:var(--sun-ink)}

.plans{display:grid;grid-auto-flow:column;grid-auto-columns:82%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;overscroll-behavior-x:contain}
.plan{scroll-snap-align:center;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plan.best{border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,154,31,.18)}
.plan header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan h3{font-size:1.3rem}
.tag{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--sun);color:var(--sun-ink);padding:3px 9px;border-radius:999px;white-space:nowrap}
.price{display:flex;align-items:baseline;gap:6px}
.price b{font:700 2.2rem var(--display);font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-size:.9rem}
.plan ul{flex:1}

.amounts{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;min-width:70px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:600 1.1rem var(--display);cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.pay{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pay .qr{width:min(220px,62vw);aspect-ratio:1;align-self:center;border-radius:12px;border:1px solid var(--line);padding:6px;background:#fff}
.pay .qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.addr{font:700 .95rem var(--body);word-break:break-all;background:rgba(28,43,42,.06);border-radius:12px;padding:10px 12px;user-select:all}
.num{font:700 1.7rem var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.warn{background:#fff6e0;border:1px solid #f1d28a;border-radius:12px;padding:10px 12px;font-size:.9rem}

form{display:grid;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:48px;width:100%}
textarea{min-height:90px;resize:vertical}
.picked{font-size:.9rem;color:var(--leaf);font-weight:700}

.nogl{display:none;position:fixed;inset:0;z-index:30;background:#10201f;color:#fff;padding:28px 20px;overflow:auto;text-align:center}
.nogl img{width:min(260px,70vw);border-radius:20px;display:block;margin:0 auto 16px}

@media (min-width:820px){
  .sheet{left:auto;right:20px;bottom:20px;width:440px;max-height:calc(100svh - 40px);border-radius:24px;transform:translateX(120%)}
  .plans{grid-auto-columns:78%}
  .backdrop{background:rgba(10,20,20,.12)}
}
@media (prefers-reduced-motion:reduce){.cue i::after,.chip3d::before,.loader div{animation:none}}
</style>

var clamp = function(v,a,b){ return Math.max(a,Math.min(b,v)); };

/* ---------- Road path the rickshaw follows (counter-clockwise loop over connected roads, rounded at every corner) ---------- */
var WPT=[[-30,-2.2],[-.2,-2.2],[-.2,-33.8],[-33.8,-33.8],[-33.8,-2.2],[37.8,-2.2],[37.8,-33.8],[4.2,-33.8],[4.2,-2.2],[68,-2.2]];
var PP=[], PD=[0], PR=2.4;
(function(){
  function nrm(a,b){ var dx=b[0]-a[0], dz=b[1]-a[1], l=Math.hypot(dx,dz); return [dx/l,dz/l]; }
  PP.push([WPT[0][0],WPT[0][1]]);
  for(var i=1;i<WPT.length-1;i++){
    var a=WPT[i-1], b=WPT[i], c=WPT[i+1], v1=nrm(a,b), v2=nrm(b,c);
    var p0=[b[0]-v1[0]*PR,b[1]-v1[1]*PR], p2=[b[0]+v2[0]*PR,b[1]+v2[1]*PR];
    PP.push(p0);
    for(var k=1;k<9;k++){ var t=k/9, u=1-t; PP.push([u*u*p0[0]+2*u*t*b[0]+t*t*p2[0], u*u*p0[1]+2*u*t*b[1]+t*t*p2[1]]); }
    PP.push(p2);
  }
  PP.push([WPT[WPT.length-1][0],WPT[WPT.length-1][1]]);
  for(var j=1;j<PP.length;j++) PD.push(PD[j-1]+Math.hypot(PP[j][0]-PP[j-1][0],PP[j][1]-PP[j-1][1]));
})();
var PLEN=PD[PD.length-1];
function pathPos(d,o){
  d=Math.max(0,Math.min(PLEN,d)); var lo=0, hi=PD.length-1;
  while(hi-lo>1){ var m=(lo+hi)>>1; if(PD[m]<=d) lo=m; else hi=m; }
  var t=(d-PD[lo])/Math.max(1e-6,PD[hi]-PD[lo]);
  o.x=PP[lo][0]+(PP[hi][0]-PP[lo][0])*t; o.z=PP[lo][1]+(PP[hi][1]-PP[lo][1])*t; return o;
}
var SI=ST.map(function(s){
  var c=Math.cos(s.rot), sn=Math.sin(s.rot);
  function T(xl,zl){ return {x:s.ox+xl*c+zl*sn, z:s.oz-xl*sn+zl*c}; }
  return {T:T, stand:T(s.x,-3.9), park:T(s.x-1.9,-2.2), cam:T(s.x+.6,-4.6), rot:s.rot, d:0};
});
(function(){
  var from=0, tmp={x:0,z:0};
  SI.forEach(function(si){
    var best=1e9, bd=from;
    for(var d=from; d<=PLEN; d+=.1){ pathPos(d,tmp); var q=Math.hypot(tmp.x-si.park.x,tmp.z-si.park.z); if(q<best){ best=q; bd=d; } }
    si.d=bd; from=bd+1;
  });
})();
/* scroll weight per leg: longer legs get more scroll distance */

function copyText(text, btn){
  var o=btn.textContent;
  function done(ok){ btn.textContent = ok ? 'Copied' : 'Press and hold to copy'; setTimeout(function(){ btn.textContent=o; },1700); }
  function fb(){ try{ var t=document.createElement('textarea'); t.value=text; t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t); t.select(); var ok=document.execCommand('copy'); document.body.removeChild(t); done(ok); }catch(e){ done(false); } }
  try{ navigator.clipboard.writeText(text).then(function(){done(true);}, fb); }catch(e){ fb(); }
}
function openSheet(key){
  lastFocus = document.activeElement;
  state.sheet = key;
  var kind = key.split(':')[0];
  if(kind==='svc') buildService(key.split(':')[1]);
  else if(kind==='pricing') buildPricing();
  else if(kind==='support') buildSupport();
  else if(kind==='work') buildWork();
  else if(kind==='map') buildMap();
  else buildContact();
  sbody.scrollTop = 0;
  sheet.classList.add('on'); sheet.setAttribute('aria-hidden','false'); backdrop.classList.add('on');
  setTimeout(function(){ $('#sheet-x').focus({preventScroll:true}); },60);
}
function closeSheet(){ try{ cancelAnimationFrame(cfRaf); }catch(e){}
  state.sheet = null;
  sheet.classList.remove('on'); sheet.setAttribute('aria-hidden','true'); backdrop.classList.remove('on');
  if(lastFocus && lastFocus.focus) try{ lastFocus.focus({preventScroll:true}); }catch(e){}
}

  var cur=Math.round(state.s), tmp={x:0,z:0}, fl=clamp(Math.floor(state.s),0,N-2), ff=clamp(state.s-fl,0,1);

  [2,4,6].forEach(function(k){ var w=SI[k].T(ST[k].x+7.2,-4.2); add(w.x,2.3,w.z); });                  /* beside three shops */
})();
function getStar(s){
  if(s.got) return; s.got=1; starsFound++;
  starN.textContent=starsFound+'/'+stars.length; starHud.classList.remove('pop'); void starHud.offsetWidth; starHud.classList.add('pop');
  confettiAt(s.x,s.y,s.z,10);
  if(starsFound===1 && !firstStarSaid){ firstStarSaid=true; showSay('A golden star! There are '+stars.length+' around the city.',3.6); }
  if(starsFound===stars.length){ showSay('All '+stars.length+' stars found. You explored the whole city!',5); state.burst(22); }
}
starN.textContent='0/'+stars.length;
var tapX=0, tapY=0;
canvas.addEventListener('pointerdown',function(e){ tapX=e.clientX; tapY=e.clientY; });
canvas.addEventListener('pointerup',function(e){
  if(Math.hypot(e.clientX-tapX,e.clientY-tapY)>10 || state.sheet) return;
  var best=null, bd=46;
  stars.forEach(function(s){ if(s.got) return; _v.set(s.x,s.o.position.y,s.z).project(camera); if(_v.z>1) return;
    var d=Math.hypot((_v.x*.5+.5)*vw-e.clientX,(-_v.y*.5+.5)*vh-e.clientY); if(d<bd){ bd=d; best=s; } });
  if(best) getStar(best);
});

/* ---------- Camera + loop ---------- */
var vw=0,vh=0,portrait=false;
function resize(){
  vw=innerWidth; vh=innerHeight; portrait=vw/vh<1.05;
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, isSmall?1.5:2));
  renderer.setSize(vw,vh,false);
  camera.aspect=vw/vh; camera.fov=portrait?58:40; camera.updateProjectionMatrix();
}
addEventListener('resize',function(){ isSmall=Math.min(innerWidth,innerHeight)<700; resize(); }); resize();

var BASE=15.5, CAMH=new V3(.34,.46,1).normalize();
var pA={x:0,z:0}, pB={x:0,z:0}, pC={x:0,z:0}, dPrev=0, arrived=0;
var chipX=-1, chipY=-1, sCur=0, last=performance.now(), tt=0, faceY=0, walkPh=0, vox=0, voy=0, first=true;
var tmpA=new V3(), camP=new V3(), camT=new V3(), hp=new V3(), pt=new V3();
var idleT=0, rideT=0, dirT=1, headAng=0, ride=0, chaseW=0, puffT=0, puffI=0, seatV=new V3(), fwdV=new V3(), rightV=new V3(), chaseP=new V3(), chaseT=new V3();
function sm01(t){ return t*t*(3-2*t); }

function swingNPC(n,amp,ph,jog){
  var a=Math.sin(ph)*amp*(jog?1.1:.75);
  n.legL.rotation.x=a; n.legR.rotation.x=-a; n.armL.rotation.x=-a*(jog?1.2:.9); n.armR.rotation.x=a*(jog?1.2:.9);
}
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(now-last)/1000); last=now; tt+=dt;
  var prev=sCur; sCur+=(state.s-sCur)*(1-Math.pow(.003,dt));
  var sc=clamp(sCur,0,N-1), i=Math.min(Math.floor(sc),N-2), f=sc-i, e=sm01(f);
  var s0=SI[i], s1=SI[i+1];
  /* the rickshaw follows the connected roads between the two stops, turning at every corner */
  var dNow=s0.d+(s1.d-s0.d)*e, vel=(dNow-dPrev)/Math.max(dt,.001); dPrev=dNow;
  var avel=Math.abs(vel), off=Math.abs(sCur-Math.round(sCur));
  if(off>.03) rideT=1; else if(off<.012) rideT=0;
  if(vel>.35) dirT=1; else if(vel<-.35) dirT=-1;
  pathPos(dNow,pA); pathPos(dNow+.7,pB); pathPos(dNow-.7,pC);
  var hAim=Math.atan2(-(pB.z-pC.z),(pB.x-pC.x))+(dirT>0?0:Math.PI), dh=Math.atan2(Math.sin(hAim-headAng),Math.cos(hAim-headAng));
  headAng+=dh*Math.min(1,dt*(Math.abs(dh)>.9?6:60));
  ride+=clamp(rideT-ride,-dt*3.2,dt*3.2); var re=sm01(ride), st1=1-re;
  rick.position.set(pA.x, Math.sin(tt*38)*.006*st1+Math.sin(tt*13)*.02*Math.min(1,avel/2), pA.z);
  rick.rotation.y=headAng; rick.updateMatrixWorld(true);
  seatV.set(.22,SEAT_Y,0); rick.localToWorld(seatV);
  fwdV.set(Math.cos(headAng),0,-Math.sin(headAng)); rightV.set(-fwdV.z,0,fwdV.x);
  var spin=avel*dt/.3; rickWheels.forEach(function(w){ w.rotation.z-=spin; });
  /* rider: hops onto the seat when the ride starts, steps off at the next shop */
  var kn=clamp(Math.round(sCur),0,N-1), hx=SI[kn].stand.x, HZ=SI[kn].stand.z;
  hero.scale.setScalar(.78+(.6-.78)*re);
  var seatRoot=seatV.y-.95*.6, hop=(ride>0&&ride<1)?Math.sin(Math.PI*re)*.7:0;
  hero.position.set(hx+(seatV.x-hx)*re, seatRoot*re+hop, HZ+(seatV.z-HZ)*re);
  var toCam=Math.atan2(camera.position.x-hx,camera.position.z-HZ);
  var df=Math.atan2(Math.sin(toCam-.35-faceY),Math.cos(toCam-.35-faceY)); faceY+=df*Math.min(1,dt*4);
  var ry=Math.atan2(Math.sin(headAng-faceY),Math.cos(headAng-faceY)); hero.rotation.y=faceY+ry*re;
  H.legL.rotation.x=-1.3*re; H.legR.rotation.x=-1.3*re;
  H.body.position.y=Math.sin(tt*2)*.012*st1+Math.sin(tt*30)*.004*re*Math.min(1,avel);
  H.body.rotation.z=0;
  /* presenting arm: opens out at a stop, grips the handlebar when riding */
  H.aP.sh.rotation.x=-1.15*re; H.aP.sh.rotation.z=st1*(1.15+Math.sin(tt*1.6)*.06)+re*.1;
  H.aP.el.rotation.z=st1*(.85+Math.sin(tt*2.2)*.12); H.aP.el.rotation.x=-.4*re;
  H.aQ.sh.rotation.x=-1.15*re; H.aQ.sh.rotation.z=st1*-.28-re*.1;
  H.aQ.el.rotation.z=st1*1.05; H.aQ.el.rotation.x=-.4*re;
  H.head.rotation.y=clamp((toCam-faceY)*.5,-.5,.5)*st1; H.head.rotation.z=Math.sin(tt*1.3)*.04*st1;
  heroShadow.visible=re<.5; heroShadow.position.set(hx,.03,HZ);
  /* exhaust puffs */
  puffs.forEach(function(pf){ var u=pf.userData; if(u.life>0){ u.life-=dt; pf.position.addScaledVector(u.v,dt); pf.scale.setScalar(.08+(1-u.life/.9)*.28); pf.material.opacity=Math.max(0,u.life/.9)*.3; if(u.life<=0) pf.visible=false; } });
  puffT-=dt;
  if(avel>.6 && puffT<=0){ puffT=.1; var pf2=puffs[puffI=(puffI+1)%puffs.length]; hp.set(-1.3,.5,.25); rick.localToWorld(hp); pf2.position.copy(hp); pf2.visible=true; pf2.userData.life=.9; pf2.userData.v.set(-fwdV.x*.8,.5,-fwdV.z*.8); }

  /* camera: station framing (rotated with each shop's road), blended into a chase camera while riding */
  var zoom=(ST[i].zoom+(ST[i+1].zoom-ST[i].zoom)*e);
  var bump=Math.sin(Math.PI*f)*(f>0&&f<1?1:0);
  var k=(portrait?1.08:1)*zoom;
  var dth=Math.atan2(Math.sin(s1.rot-s0.rot),Math.cos(s1.rot-s0.rot)), yaw=s0.rot+dth*e, cyw=Math.cos(yaw), syw=Math.sin(yaw);
  camT.set(s0.cam.x+(s1.cam.x-s0.cam.x)*e, 3.0+bump*1.2, s0.cam.z+(s1.cam.z-s0.cam.z)*e);
  var dist=BASE*k*(1+bump*.95);
  tmpA.set(CAMH.x*cyw+CAMH.z*syw, CAMH.y, -CAMH.x*syw+CAMH.z*cyw);
  camP.copy(tmpA).multiplyScalar(dist).add(camT);
  camP.x+=Math.sin(tt*.2)*(reduce?0:.4)*bump;
  chaseW+=clamp(re-chaseW,-dt*1.8,dt*1.8); var cwe=sm01(chaseW);
  if(cwe>.001){
    chaseP.copy(rick.position).addScaledVector(fwdV,-6.4).addScaledVector(rightV,1.9); chaseP.y=6.0;
    chaseT.copy(rick.position).addScaledVector(fwdV,5.2); chaseT.y=1.0;
    camP.lerp(chaseP,cwe); camT.lerp(chaseT,cwe);
  }
  camera.position.copy(camP); camera.lookAt(camT);
  var fovT=(portrait?58:40)+8*cwe*Math.min(1,avel/3); camera.fov+=(fovT-camera.fov)*Math.min(1,dt*6);
  /* make room for the sheet */
  var wantY=0,wantX=0;
  if(state.sheet){ if(vw>=820) wantX=vw*.18; else wantY=vh*.27; }
  vox+=(wantX-vox)*Math.min(1,dt*6); voy+=(wantY-voy)*Math.min(1,dt*6);
  camera.setViewOffset(vw,vh,vox,voy,vw,vh);
  sun.position.copy(camT).add(SUNOFF); sun.target.position.copy(camT);

  /* option chip near the presenting hand */
  var near=Math.abs(sCur-Math.round(sCur))<.045, st=ST[Math.round(sCur)];
  if(near && st.chip && !state.sheet && ride<.04){
    if(chip.textContent!==st.chip) chip.textContent=st.chip;
    hero.updateMatrixWorld(true); hp.set(1.5,2.25,.1); hero.localToWorld(hp);
    pt.copy(hp).project(camera);
    var px=(pt.x*.5+.5)*vw, py=(-pt.y*.5+.5)*vh;
    var cw=chip.offsetWidth||140, ch=chip.offsetHeight||46;
    var tx=Math.round(clamp(px+6,12,vw-cw-12)), ty=Math.round(clamp(py-ch*.5,70,vh-ch-24));
    if(tx!==chipX||ty!==chipY){ chipX=tx; chipY=ty; chip.style.transform='translate('+tx+'px,'+ty+'px)'; }
    chip.classList.add('on'); chip.tabIndex=0;
  } else { chip.classList.remove('on'); chip.tabIndex=-1; }

  /* NPCs */
  for(var a=0;a<npcs.length;a++){
    var n=npcs[a];
    if(n.mode==='patrol'){
      if(n.wait>0){ n.wait-=dt; swingNPC(n,0,0,false); n.ph+=dt; n.head.rotation.y=Math.sin(n.ph*1.2)*.4; }
      else {
        n.ph+=dt*n.v*3.4; swingNPC(n,.8,n.ph,n.jog);
        if(n.axis==='z'){ n.z+=n.dir*n.v*dt; if(n.z>n.x1) n.z=n.x0; else if(n.z<n.x0) n.z=n.x1; }
        else { n.x+=n.dir*n.v*dt; if(n.x>n.x1){ n.x=n.x0; } else if(n.x<n.x0){ n.x=n.x1; } }
        if(!n.jog && rnd()<.0006) n.wait=rr(1.5,4);
        n.head.rotation.y=0;
      }
      n.g.position.set(n.x,Math.abs(Math.sin(n.ph))*.04*(n.wait>0?0:1),n.z); n.g.rotation.y=n.axis==='z'?(n.dir>0?0:Math.PI):(n.dir>0?Math.PI/2:-Math.PI/2);
    } else if(n.mode==='wander'){
      if(n.wait>0){ n.wait-=dt; swingNPC(n,0,0,false); n.ph+=dt; n.armL.rotation.x=Math.sin(n.ph*2)*.15; }
      else {
        var dx=n.tx-n.x, dz=n.tz-n.z, d=Math.hypot(dx,dz);
        if(d<.2){ n.wait=rr(1,4); n.tx=rr(n.rect[0],n.rect[1]); n.tz=rr(n.rect[2],n.rect[3]); }
        else { n.x+=dx/d*n.v*dt; n.z+=dz/d*n.v*dt; n.ph+=dt*n.v*3.4; swingNPC(n,.7,n.ph,false); var wf=Math.atan2(dx,dz); var dd=Math.atan2(Math.sin(wf-n.face),Math.cos(wf-n.face)); n.face+=dd*Math.min(1,dt*6); }
      }
      n.g.position.set(n.x,0,n.z); n.g.rotation.y=n.face;
    } else {
      n.ph+=dt; var t2=n.ph;
      n.armL.rotation.x=Math.sin(t2*2.1)*.35; n.armL.rotation.z=.15; n.armR.rotation.x=Math.sin(t2*1.7+1)*.25;
      n.head.rotation.y=Math.sin(t2*.9)*.25; n.head.rotation.x=Math.sin(t2*1.8)*.05;
      n.g.position.set(n.x,0,n.z); n.g.rotation.y=n.face;
    }
  }
  /* cars */
  for(var c=0;c<cars.length;c++){
    var cr=cars[c]; cr.p+=cr.v*cr.dir*dt;
    if(cr.axis==='z'){ if(cr.p>-1) cr.p=-68; else if(cr.p<-68) cr.p=-1; cr.g.position.set(cr.fx,0,cr.p); cr.g.scale.setScalar(clamp(Math.min(cr.p+68,-1-cr.p)/3,.02,1)); }
    else { if(cr.p>95) cr.p=-95; else if(cr.p<-95) cr.p=95; cr.g.position.set(cr.p,0,cr.fx); } for(var w=0;w<4;w++) cr.wheels[w].rotation.z-=dt*cr.v*cr.dir*3;
  }
  clouds.forEach(function(cl){ cl.position.x+=cl.userData.v*dt*(reduce?.2:1); if(cl.position.x>115) cl.position.x=-115; });
  if(bigCoin) bigCoin.rotation.y+=dt*(reduce?.2:1.1);
  coins.forEach(function(cn){ var u=cn.userData; if(u.life<=0) return; u.life-=dt; u.v.y-=12*dt; cn.position.addScaledVector(u.v,dt); cn.rotation.y+=dt*9; cn.scale.setScalar(Math.max(0,Math.min(1,u.life/.4))); if(u.life<=0||cn.position.y<0){ u.life=0; cn.visible=false; } });
  /* arrival: roof prop pops, sign pulses, sparkle ring, bubble */
  var kNear=clamp(Math.round(sCur),0,N-1);
  if(ride>.5) arrived=-1;
  else if(ride<.04 && off<.03 && arrived!==kNear){ arrived=kNear; arrive(kNear); }
  for(var pi=0; pi<props.length; pi++){ var pr=props[pi]; if(!pr) continue;
    if(pr.pop>0) pr.pop=Math.max(0,pr.pop-dt/1.2);
    var pp=pr.pop, bob=reduce?0:Math.sin(tt*1.5+pr.ph)*.1;
    pr.o.position.y=pr.y+bob+pp*Math.abs(Math.sin((1-pp)*9))*1.1;
    pr.o.scale.setScalar(1+.3*pp*Math.sin((1-pp)*12));
    if(pr.rot!==null && !reduce) pr.o.rotation.y=pr.rot+Math.sin(tt*.9+pr.ph)*.07;
  }
  for(var sg=0; sg<signPulse.length; sg++){ if(signPulse[sg]>0 && signMeshes[sg]){ signPulse[sg]=Math.max(0,signPulse[sg]-dt/.9); signMeshes[sg].scale.setScalar(1+.12*Math.sin(signPulse[sg]*Math.PI)); } }
  if(ringT<1){ ringT+=dt/.9; ring.visible=true; ring.scale.setScalar(1+ringT*5); ring.material.opacity=.8*(1-ringT); } else ring.visible=false;
  confetti.forEach(function(c){ var u=c.userData; if(u.life<=0) return; u.life-=dt; u.v.y-=9*dt; c.position.addScaledVector(u.v,dt); c.rotation.x+=dt*u.sp; c.rotation.y+=dt*u.sp*.7; c.scale.setScalar(Math.max(0,Math.min(1,u.life/.3)));
    if(u.life<=0||c.position.y<0){ u.life=0; c.visible=false; } });
  stars.forEach(function(s){
    if(s.got>0 && s.got<2){ s.got+=dt*1.6; s.o.position.y=s.y+(s.got-1)*3; s.o.scale.setScalar(Math.max(0,1-(s.got-1))); if(s.got>=2) s.o.visible=false; return; }
    if(s.got>=2) return;
    s.o.rotation.y+=dt*(reduce?.3:1.8); s.o.position.y=s.y+(reduce?0:Math.sin(tt*2+s.ph)*.18); s.o.scale.setScalar(1+Math.sin(tt*3+s.ph)*.06);
    if(Math.hypot(s.x-rick.position.x,s.z-rick.position.z)<2.6 || Math.hypot(s.x-hero.position.x,s.z-hero.position.z)<2.2) getStar(s);
  });
  if(sayT>0 && !state.sheet){
    sayT-=dt; hero.updateMatrixWorld(true); hp.set(0,2.3,0); hero.localToWorld(hp); pt.copy(hp).project(camera);
    var bx2=clamp((pt.x*.5+.5)*vw,110,vw-110), by2=(-pt.y*.5+.5)*vh;
    sayEl.style.transform='translate('+Math.round(bx2)+'px,'+Math.round(by2-14)+'px) translate(-50%,-100%)'; sayEl.classList.add('on');
  } else { sayEl.classList.remove('on'); if(state.sheet) sayT=0; }
  dayNightTick(dt);
  renderer.render(scene,camera);
  if(first){ first=false; $('#loader').classList.add('done'); }
}

/* ---------- Boot: wait for fonts + poster, then build signs and start ---------- */
var img=new Image();
var imgP=new Promise(function(res){ img.onload=function(){res(img);}; img.onerror=function(){res(null);}; img.src=POSTER; });
var fontP=Promise.race([ (document.fonts&&document.fonts.load) ? Promise.all([document.fonts.load('700 40px Fredoka'),document.fonts.load('700 40px "Nunito Sans"')]) : Promise.resolve(), new Promise(function(r){ setTimeout(r,2500); }) ]);
Promise.all([imgP,fontP]).then(function(r){ try{ buildSigns(r[0]); }catch(e){} requestAnimationFrame(frame); });
})();
